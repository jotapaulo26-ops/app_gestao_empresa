<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Brilho Neon Radial de Fundo -->
    <radialGradient id="neonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#00ff88" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente do Chapéu de Chef (Neon Rosa para Esmeralda) -->
    <linearGradient id="chefHatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>

    <!-- Efeito Neon Bloom -->
    <filter id="neonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo OLED Dark com cantos arredondados para app móvel -->
  <rect width="512" height="512" rx="112" fill="#050505"/>
  <circle cx="256" cy="256" r="230" fill="url(#neonGlow)"/>

  <!-- Borda de Destaque Neon -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="url(#chefHatGrad)" stroke-width="8" stroke-opacity="0.8"/>

  <!-- Chapéu de Chef de Cozinha (Chef Hat / Toque Blanche) Estilizado -->
  <g filter="url(#neonFilter)" stroke="url(#chefHatGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Faixa Inferior da Base do Chapéu -->
    <rect x="146" y="350" width="220" height="48" rx="14" fill="#0d0d0d" stroke-width="20"/>

    <!-- Detalhes da Faixa -->
    <line x1="190" y1="374" x2="322" y2="374" stroke="#00f0ff" stroke-width="10"/>

    <!-- Corpo e Dobras Fofas do Chapéu de Chef -->
    <!-- Curvas dos 3 gomos principais (esquerda, topo-centro, direita) -->
    <path d="M 166 348 
             C 120 340, 100 270, 140 220 
             C 115 170, 175 110, 230 140 
             C 256 95, 305 105, 320 145 
             C 380 120, 420 180, 390 230 
             C 425 280, 395 340, 346 348 Z" 
          fill="#111111" 
          stroke-width="22"/>

    <!-- Dobras e Nervuras Internas do Chapéu -->
    <path d="M 215 348 C 210 270, 200 200, 235 155" fill="none" stroke-width="14" stroke-opacity="0.9"/>
    <path d="M 297 348 C 302 270, 312 200, 285 155" fill="none" stroke-width="14" stroke-opacity="0.9"/>

    <!-- Detalhe Central: Estrela de Mestre Cuca / Faísca Neon -->
    <circle cx="256" cy="256" r="14" fill="#00ff88" stroke="#ffffff" stroke-width="4"/>
  </g>
</svg>
